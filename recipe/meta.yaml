{%set name = "mccabe" %}
{% set version = "0.7.0" %}
{%set hash_type = "sha256" %}
{% set hash_val = "348e0240c33b60bbdf4e523192ef919f28cb2c3d7d5c7794f74009290f236325" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  fn: {{ name }}-{{ version }}.tar.gz
  url: https://pypi.io/packages/source/{{ name[0] }}/{{ name }}/{{ name }}-{{ version }}.tar.gz
  {{ hash_type }}: {{ hash_val }}

build:
  number: 1
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps -vv

requirements:
  host:
    - python
    - pip
    - setuptools
    - wheel
  run:
    - python >=3.6

test:
  imports:
    - {{ name }}
  requires:
    - pip
    - python
  commands:
    - pip check

about:
  home: https://github.com/PyCQA/mccabe
  license: MIT
  license_family: MIT
  license_file: LICENSE
  summary: McCabe complexity checker for Python
  dev_url: https://github.com/PyCQA/mccabe
  doc_url: https://github.com/PyCQA/mccabe/blob/master/README.rst

extra:
  recipe-maintainers:
    - jakirkham
    - sigmavirus24
    - ocefpaf
    - dopplershift
